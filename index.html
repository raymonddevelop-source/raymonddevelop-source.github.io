<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raymond Develop</title>
  <meta name="description" content="Diseño web en Puerto Rico. Landing pages, menús digitales, QR y sitios que convierten." />
  <meta name="theme-color" content="#070914" />

  <style>
    :root{
      --bg0:#070914;
      --bg1:#0b0f24;

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.52);

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --shadow2: 0 10px 28px rgba(0,0,0,.35);

      --r2: 26px;
      --max: 1120px;
      --ease: cubic-bezier(.2,.9,.2,1);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(124,77,255,.18), transparent 60%),
        radial-gradient(900px 700px at 85% 0%, rgba(53,209,255,.14), transparent 58%),
        radial-gradient(900px 700px at 60% 90%, rgba(255,79,216,.10), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    .stage{
      width:100vw;
      position:relative;
      left:50%;
      transform:translateX(-50%);
      min-height:100svh;
    }

    .nav{
      position:sticky;
      top:0;
      z-index:50;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      background: rgba(7,9,20,.55);
      border-bottom: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
    }

    .nav-inner{
      width:min(var(--max), 94vw);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .burger{
      width:40px; height:40px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .brand-mini{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand-mini img{
      width:28px; height:28px;
      border-radius:10px;
    }

    .brand-mini .name{
      font-weight:900;
      font-size:15px;
    }

    .wrap{
      width:min(var(--max), 94vw);
      margin:0 auto;
      padding: 18px 0 70px;
    }

    .hero{
      padding: 18px 0 10px;
      display:grid;
      gap: 14px;
      justify-items:center;
      text-align:center;
    }

    .logo-big{
      width:min(74vw, 360px);
      aspect-ratio:1/1;
      border-radius:999px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      display:grid;
      place-items:center;
      overflow:hidden;
      transform: translateY(12px);
      opacity:0;
      transition:.6s var(--ease);
    }
    .logo-big.in{ transform:none; opacity:1; }

    .logo-big img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .hero-title{
      font-size: clamp(22px, 5vw, 34px);
      font-weight:1000;
      opacity:0;
      transform:translateY(10px);
      transition:.6s var(--ease);
    }
    .hero-title.in{ opacity:1; transform:none; }

    .hero-actions{
      display:flex;
      justify-content:center;
      margin-top:6px;
      opacity:0;
      transform:translateY(10px);
      transition:.6s var(--ease);
    }
    .hero-actions.in{ opacity:1; transform:none; }

    .btn{
      padding:14px 22px;
      border-radius:999px;
      border:1px solid rgba(53,209,255,.26);
      background: linear-gradient(90deg, rgba(53,209,255,.18), rgba(124,77,255,.10));
      color:#fff;
      font-weight:950;
      text-decoration:none;
    }

    .section{ margin-top:22px; }

    footer{
      margin-top:22px;
      padding:18px 0;
      border-top:1px solid rgba(255,255,255,.10);
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.55);
    }
  </style>
</head>

<body>

<header class="nav">
  <div class="nav-inner">
    <div class="burger">☰</div>
    <div class="brand-mini">
      <img src="logo.png" alt="Logo">
      <div class="name">RaymondDevelop</div>
    </div>
  </div>
</header>

<main class="stage">
  <div class="wrap">

    <section class="hero">
      <div class="logo-big" id="logoBig">
        <img src="logo.png" alt="Raymond Develop">
      </div>

      <h2 class="hero-title" id="heroTitle">
        Diseño de páginas web en Puerto Rico para tu negocio
      </h2>

      <div class="hero-actions" id="heroActions">
        <a class="btn" href="#contact">Contáctanos</a>
      </div>
    </section>

    <section class="section" id="contact">
      <h2 style="text-align:center">Contáctanos</h2>
      <p style="text-align:center">WhatsApp · Llamada · Email</p>
    </section>

    <footer>
      © <span id="year"></span> Raymond Develop
    </footer>

  </div>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  requestAnimationFrame(()=>{
    logoBig.classList.add('in');
    heroTitle.classList.add('in');
    heroActions.classList.add('in');
  });
</script>

</body>
</html>
